html,body{margin:0;height:100%;background:#0b1020;color:#e8eefc;

<script>
window.onerror = function(msg, src, line){
  try{
    var d=document.getElementById('fatal');
    if(!d){ d=document.createElement('div'); d.id='fatal';
      d.style.cssText='position:fixed;inset:0;z-index:999;background:#0b1020;color:#e8eefc;padding:24px;font-size:13px;white-space:pre-wrap;overflow:auto';
      document.body.appendChild(d); }
    d.textContent = '页面出错了（把这段发给我）：\n' + msg + '\n' + (src||'') + ':' + line;
  }catch(e){}
};

// ---------- 访问口令 ----------
const TOKEN_KEY='dafeiyu_token';
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
async function apiFetch(url,opt){
  opt=opt||{}; opt.headers=Object.assign({}, opt.headers||{});
  const tk=getToken(); if(tk) opt.headers['X-Token']=tk;
  let r=await fetch(url,opt);
  if(r.status===401){
    const t=prompt('请输入访问口令');
    if(t){ localStorage.setItem(TOKEN_KEY,t.trim());
      opt.headers['X-Token']=t.trim(); r=await fetch(url,opt); }
  }
  return r;
}

const AV_HER='/static/icon-192.png';
const log=document.getElementById('log'),box=document.getElementById('box'),
      sendBtn=document.getElementById('send'),mic=document.getElementById('mic'),
      file=document.getElementById('file'),tip=document.getElementById('tip');
function scroll(){log.scrollTop=log.scrollHeight;}
function showTip(t,ms){tip.textContent=t;tip.style.display='block';
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.style.display='none',ms||1600);}
function mkRow(who){
  const row=document.createElement('div');row.className='row '+(who==='me'?'me':'');
  const av=document.createElement('img');av.className='av';
  av.src=who==='me'?'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76"><rect width="76" height="76" rx="38" fill="#2f6bff"/><text x="38" y="48" font-size="30" text-anchor="middle" fill="#fff" font-family="sans-serif">我</text></svg>')
    :AV_HER;
  const b=document.createElement('div');b.className='bub '+(who==='me'?'me':'her');
  row.appendChild(av);row.appendChild(b);log.appendChild(row);scroll();
  return b;
}
function textBubble(who,text){const b=mkRow(who);b.textContent=text;return b;}
function imgBubble(who,src){const b=mkRow(who);const im=document.createElement('img');im.src=src;b.appendChild(im);return b;}
function waveHtml(n){let h='<div class="wave">';for(let i=0;i<(n||5);i++){
  const hh=4+Math.round(Math.random()*10);h+=`<i style="height:${hh}px"></i>`;}return h+'</div>';}
function voiceBubble(text,audio,durSec){
  const b=mkRow('her');
  b.classList.add('showtxt');           // 文字直接显示，不再需要长按
  const v=document.createElement('div');v.className='voice';
  v.innerHTML='<div class="tri"></div>'+waveHtml(6)+`<span class="dur">${durSec||Math.max(1,Math.round(text.length/4))}"</span>`;
  b.appendChild(v);
  const hidden=document.createElement('div');hidden.className='txt';
  hidden.style.cssText='display:block;margin-top:6px;font-size:14px;line-height:1.5;color:#dcE8ff';
  hidden.textContent=text;b.appendChild(hidden);
  const a=document.createElement('audio');a.src=audio;a.preload='auto';b.appendChild(a);
  v.onclick=()=>{a.play().catch(()=>{});v.classList.add('playing');
    setTimeout(()=>v.classList.remove('playing'),Math.max(1500,(durSec||4)*1000));};
  let lp;const start=()=>{lp=setTimeout(()=>{b.classList.toggle('showtxt');},550);};
  const cancel=()=>clearTimeout(lp);
  v.addEventListener('touchstart',start,{passive:true});
  v.addEventListener('touchend',cancel);
  v.addEventListener('mousedown',start);
  v.addEventListener('mouseup',cancel);
  v.addEventListener('contextmenu',e=>{e.preventDefault();b.classList.toggle('showtxt');});
  return b;
}


// 兼容老 WebView：不用后行断言（(?<=) 在 Chrome<62 会整段语法错误）
function splitKeepPunct(text, puncts){
  const out=[]; let cur='';
  for(let i=0;i<text.length;i++){
    const ch=text[i]; cur+=ch;
    if(puncts.indexOf(ch)>=0){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out;
}
const SENT_PUNCT = '。！？!?…~～\n';

// ---------- 公共：文本清理 / 播放队列 ----------
function clean(t){
  return (t||'')
    .replace(/\[draw\][\s\S]*?(\[\/draw\]|$)/g,'')
    .replace(/\[meme\][\s\S]*?(\[\/meme\]|$)/g,'')
    .replace(/(用户未成年|露骨色情)[\s\S]*?(safety|规则|$)/gi,'')
    .replace(/【[^】]{0,6}】/g,'');
}
let activePlayer = null, callSpeaking = false;
function playUrl(url, metaText){
  const a = document.getElementById('gAudio');
  if(!a) return null;
  try{ a.pause(); }catch(e){}
  a.src = url; a.currentTime = 0;
  if(metaText !== undefined) avSpeak(a, metaText || '');
  a.play().catch(function(){});
  return a;
}
function stopAudio(){
  const a = document.getElementById('gAudio');
  if(!a) return;
  try{ a.pause(); a.removeAttribute('src'); a.load(); }catch(e){}
  try{ avShut(); }catch(e){}
}

function makePlayer(){
  const q=[]; let running=false, cur=null, stopped=false;
  async function pump(){
    if(running) return; running=true;
    while(q.length){
      if(stopped) break;
      const item=q.shift();
      const meta = (item && item.u) ? item : {u:item, t:''};
      let url=meta.u;
      if(url && typeof url.then==='function'){ try{ url=await url; }catch(e){ url=null; } }
      if(!url) continue;
      playing = null; callSpeaking = true;
      if(stopped){ callSpeaking = false; break; }
      await new Promise(res=>{
        const a = playUrl(url, meta.t); window._lastAudio=a; cur=a;
        if(!a){ res(); return; }
        avSpeak(a, meta.t);
        a.onended=function(){ avShut(); if(cur===a) cur=null; res(); };
        a.onerror=function(){ avShut(); if(cur===a) cur=null; res(); };
        const pr=a.play();
        if(pr&&pr.catch){ pr.catch(()=>{ avShut(); res(); }); }
      });
    }
    running=false; callSpeaking=false;
  }
  return {
    push(u){ if(stopped) return; q.push(u); pump(); },
    clear(){ q.length=0; },
    stop(){
      stopped = true; q.length = 0; callSpeaking = false;
      try{ if(cur){ cur.pause(); cur.src=''; } }catch(e){}
      cur = null; try{ avShut(); }catch(e){}
    }
  };
}

let sendingNow = false;
async function sayText(text){
  if(!text.trim())return;
  if(sendingNow) return;
  sendingNow = true;
  textBubble('me',text);box.value='';box.style.height='auto';sendBtn.disabled=true;
  try{ if(activePlayer){ activePlayer.stop(); activePlayer=null; } }catch(e){}
  try{ stopAudio(); }catch(e){}
  const b=mkRow('her');b.textContent='';
  let raw='', spoken='', player=null, audioDone=false;
  const ensurePlayer=()=>{
    if(!player){ player=makePlayer(); activePlayer=player; }
    return player;
  };
  let firstChunk = true;
  const flushPart=(final)=>{
    let ready = '';
    if(final){
      ready = spoken; spoken = '';
    } else {
      let m = spoken.match(/^[\s\S]*?[。！？!?…~～\n]/);   // 到第一个句子边界
      if(!m && spoken.length >= 4) m = spoken.match(/^[\s\S]*?[，,、；;]/);  // 首句：有逗号也先切
      if(!m) return;
      // 后续块攒大一点（减少合成次数和空隙），但不超过 24 字
      if(!firstChunk && m[0].length < 10 && spoken.length < 24){
        const m2 = spoken.match(/^[\s\S]{0,24}?[。！？!?…~～\n]/);
        if(m2 && m2[0].length >= 10) m = m2;
      }
      ready = m[0];
      spoken = spoken.slice(ready.length);
    }
    const txt = ready.trim();
    if(txt.length >= 2){
      ensurePlayer().push(ttsUrl(txt, firstChunk));   // 第一句走快速路径
      firstChunk = false;
    }
  };
  try{
    const resp=await apiFetch('/api/stream?text='+encodeURIComponent(text));
    const rd=resp.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        if(!chunk.startsWith('data:'))continue;
        let ev; try{ ev=JSON.parse(chunk.slice(5).trim()); }catch(e){ continue; }
        if(ev.type==='ping') continue;
        if(ev.type==='delta'){
          raw+=ev.t; spoken+=ev.t;
          b.textContent=clean(raw);scroll();
          // 一出句号/逗号就先合成，抢时间
          if(/[。！？!?…~～\n]/.test(ev.t) || (spoken.length>=6 && /[，,、；;：:]/.test(ev.t))) flushPart(false);
        } else if(ev.type==='done'){
          // 文字永远是主角：气泡保留，不再删掉换成语音条
          const replyText = (ev.reply || clean(raw) || '').trim();
          if(replyText) b.textContent = replyText;
          else if(!(ev.images||[]).length) b.textContent = '……';

          // 有现成音频：就地在气泡里放一个小播放器，自动播
          if(ev.audio){
            try{
              if(player){ player.stop(); player=null; }
              if(activePlayer){ activePlayer.stop(); activePlayer=null; }
            }catch(e){}
            playUrl(ev.audio, replyText);
            const tag=document.createElement('div');
            tag.className='playTag'; tag.textContent='🔊 点这里重听';
            tag.onclick=function(){ playUrl(ev.audio, replyText); };
            b.appendChild(tag);
          } else if(replyText){
            // 没有现成音频：边合成边播，文字照旧留着
            const parts = splitKeepPunct(spoken || replyText, SENT_PUNCT);
            const rest = (parts.pop()||'').trim();
            const ready = parts.join('').trim();
            spoken = '';
            if(ready) ensurePlayer().push(ttsUrl(ready, true));
            if(rest) ensurePlayer().push(ttsUrl(rest, false));
          }
          (ev.images||[]).forEach(im=>imgBubble('her',im));
          scroll();
        } else if(ev.type==='error'){ b.textContent='连不上她……'; }
      }
    }
  }catch(e){
    // 流式断了：先试一次普通请求兜底，别直接报"连不上"
    if(!(raw||'').trim()){
      try{
        const r2 = await apiFetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text:text})});
        const d2 = await r2.json();
        if(d2 && d2.reply){
          b.textContent = d2.reply;
          if(d2.audio){ playUrl(d2.audio, d2.reply);
            const tag=document.createElement('div'); tag.className='playTag';
            tag.textContent='🔊 点这里重听';
            tag.onclick=function(){ playUrl(d2.audio, d2.reply); };
            b.appendChild(tag);
          }
        } else { b.textContent='连不上她，再试一次？'; }
      }catch(e2){ b.textContent='连不上她，再试一次？'; }
    } else {
      b.textContent = clean(raw) + '（断了一下）';
    }
  }
  sendingNow = false; sendBtn.disabled=false;scroll();
}

// 按句渐进播放（聊天用）：第一句先合成先播，边播边合成下一句
function splitSentences(t){
  const raw = splitKeepPunct(t||'', SENT_PUNCT).map(x=>x.trim()).filter(Boolean);
  const out=[]; let cur='';
  for(const p of raw){
    if(cur && (cur.length+p.length) > 20){ out.push(cur); cur=p; }
    else cur += p;
  }
  if(cur) out.push(cur);
  return out.length ? out : (t? [t] : []);
}
async function ttsUrl(text, fast, emo){
  try{
    const body = { text };
    if(fast) body.fast = true;
    if(emo) body.emotion = emo;
    const r = await apiFetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const d = await r.json(); return d.audio||null;
  }catch(e){ return null; }
}
async function speakProgressive(text){
  const parts = splitSentences(text);
  if(!parts.length) return;
  let next = ttsUrl(parts[0], true);      // 第一句用快速路径
  for(let i=0;i<parts.length;i++){
    const cur = next;
    next = (i+1<parts.length) ? ttsUrl(parts[i+1], false) : Promise.resolve(null);
    const url = await cur;
    if(!url){ textBubble('her', parts[i]); continue; }
    const b = voiceBubble(parts[i], url);
    const a = b.querySelector('audio');
    if(a){
      try{
        await new Promise(res=>{ a.onended=res; a.onerror=res; a.play().catch(res); });
      }catch(e){}
    }
  }
}

let avLevel=0, avS=1, avAttached=new WeakSet();

function avLayout(){

function avRender(){

// ---------- 动作引擎：呼吸 / 摇摆 / 歪头 / 点头 / 说话抖动 / 听你说话时前倾 ----------
let avT0 = performance.now();
let avTalking = false, avListening = false;
let avMicro = {type:'', until:0, next: performance.now() + 4000};
let avPupil = {x:0, y:0, tx:0, ty:0};
let avPupilL = null, avPupilR = null;   // 眼珠层（后续再启用）

function pickMicro(now){
  const types = ['tilt','nod','shrug','look'];
  avMicro.type = types[Math.floor(Math.random()*types.length)];
  avMicro.until = now + 900 + Math.random()*700;
  avMicro.next = now + 4200 + Math.random()*5200;
}

(function avMotion(now){
  if(avBox){
    const t = (now - avT0) / 1000;
    // 基础：呼吸
    let y = Math.sin(t*1.05) * 4;
    let x = Math.sin(t*0.43) * 3.5;          // 很慢的左右摇摆
    let rot = Math.sin(t*0.37 + 1.1) * 0.8;  // 极轻微的倾
    let sc = 1 + Math.sin(t*1.05 + 1.3) * 0.004;

    // 小动作
    if(now > avMicro.next) pickMicro(now);
    if(now < avMicro.until){
      const k = Math.sin((avMicro.until - now)/1000 * 6) * Math.min(1,(avMicro.until-now)/300);
      if(avMicro.type==='tilt')  rot += k*2.2;
      if(avMicro.type==='nod')   y   += Math.abs(k)*5;
      if(avMicro.type==='shrug') sc  += Math.abs(k)*0.008;
      if(avMicro.type==='look')  avPupil.tx = k*3, avPupil.ty = k*2;
    } else {
      avPupil.tx *= 0.92; avPupil.ty *= 0.92;
    }

    // 说话时：跟着嘴型轻微点头 + 上下颠
    if(avTalking){
      y += (avLevel-0.5) * 3 + Math.sin(t*7.5) * 1.2;
      rot += Math.sin(t*3.1) * 0.6;
    }
    // 听你说话：微微前倾（放大 1.5%）
    if(avListening) sc += 0.015;

    avBox.style.transform =
      'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) rotate(' + rot.toFixed(2) +
      'deg) scale(' + sc.toFixed(4) + ')';

    try{ avWarp(now); }catch(e){}
    // 眼珠微动
    avPupil.x += (avPupil.tx - avPupil.x) * 0.15;
    avPupil.y += (avPupil.ty - avPupil.y) * 0.15;
    if(avPupilL) avPupilL.style.transform = 'translate(' + avPupil.x.toFixed(1) + 'px,' + avPupil.y.toFixed(1) + 'px)';
    if(avPupilR) avPupilR.style.transform = 'translate(' + avPupil.x.toFixed(1) + 'px,' + avPupil.y.toFixed(1) + 'px)';
  }
  requestAnimationFrame(avMotion);
})(performance.now());

// 用她的声音驱动嘴
let avCtx=null, avAnalyser=null, avBuf=null, avRaf=0;
function avAttach(a){
  try{
    if(!a || avAttached.has(a)) { return; }
    avAttached.add(a);
    avCtx = avCtx || new (window.AudioContext||window.webkitAudioContext)();
    const src = avCtx.createMediaElementSource(a);
    avAnalyser = avCtx.createAnalyser();
    avAnalyser.fftSize = 512;
    avBuf = new Uint8Array(avAnalyser.frequencyBinCount);
    src.connect(avAnalyser);
    avAnalyser.connect(avCtx.destination);
    cancelAnimationFrame(avRaf);
    (function tick(){
      avAnalyser.getByteTimeDomainData(avBuf);
      let sum=0;
      for(let i=0;i<avBuf.length;i++){ const d=(avBuf[i]-128)/128; sum+=d*d; }
      const rms=Math.sqrt(sum/avBuf.length);
      avLevel = Math.min(1, Math.pow(rms*5.5, 0.7));
      avRender();
      if(a.paused || a.ended){ avLevel=0; avRender(); return; }
      avRaf = requestAnimationFrame(tick);
    })();
  }catch(e){}
}

let avSpeakTimer=0;
function avShut(){
  clearInterval(avSpeakTimer); avSpeakTimer=0;
  avLevel=0; avTalking=false; avRender();
}
function avSpeak(a, text){
  avShut();
  avTalking = true;

      avLevel = 0.30 + Math.random()*0.62;
    } else {
      avLevel = 0.35 + Math.random()*0.5;
    }
    avRender();
  }, 105);
}

// 抓一帧，缩到 512 宽，送后端让她"看见"
async function pushFrame(){
  if(!camOn || !camEl || !camEl.videoWidth) return;
  try{
    const w=512, h=Math.round(camEl.videoHeight*w/camEl.videoWidth);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(camEl,0,0,w,h);
    const data=cv.toDataURL('image/jpeg',0.62);
    await apiFetch('/api/vision_note',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:data})});
  }catch(e){}
}

// ---------- 头发/裙摆飘动：canvas 竖条波浪 ----------
const avCanvas = document.getElementById('avCanvas');
let avImg = new Image();
avImg.src = '/api/appearance?t=' + Date.now();
let avReady = false;
avImg.onload = function(){ avReady = true; };

function avWarp(now){
  if(!avReady || !avCanvas) return;
  const ctx = avCanvas.getContext('2d');
  const W = avCanvas.width, H = avCanvas.height;
  const t = now / 1000;
  const STRIPS = 22;
  const sw = W / STRIPS;
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < STRIPS; i++){
    const x = i * sw;
    // 权重：中间不动，越靠边越飘
    const cx = Math.abs((x + sw/2) / W - 0.5) * 2;      // 0 中心 → 1 边缘
    const w = Math.pow(cx, 2.2);
    // 越往下飘得越明显（头发/裙子在下面）
    const dx = Math.sin(t * 1.6 + i * 0.55) * 5.2 * w;
    const dy = Math.cos(t * 1.1 + i * 0.4) * 1.4 * w;
    ctx.drawImage(avImg, x, 0, sw, H, x + dx, dy, sw + 0.6, H);
  }
}

async function listenLoop(){
  if(!inCall) return;
  const myId = ++callLoopId;
  cstat.textContent='说吧，我听着';
  const buf=new Uint8Array(analyser.frequencyBinCount);
  callRec=new MediaRecorder(callStream); callChunks=[];
  callRec.ondataavailable=e=>{ if(e.data.size>0) callChunks.push(e.data); };
  callRec.start();
  let started=false, silentSince=0, bargeStart=0;

  let lastVoice = Date.now(), idleFired = 0;
  const tick=()=>{
    if(!inCall || myId !== callLoopId) return;
    analyser.getByteTimeDomainData(buf);
    const r=rmsOf(buf);
    if(playing && r>0.05){
      if(!bargeStart) bargeStart=Date.now();
      if(Date.now()-bargeStart>300){
        try{ playing.pause(); }catch(e){}
        try{ if(activePlayer) activePlayer.stop(); }catch(e){}
        playing=null; bargeStart=0; cstat.textContent='…你说';
      }
    } else if(r<=0.05){ bargeStart=0; }
    if(!paused){
      if(r>0.022){ started=true; silentSince=0; lastVoice=Date.now(); idleFired=0; waveBars(true);
        avListening = !avTalking;
        if(cstat.textContent==='说吧，我听着') cstat.textContent='…'; }
      else if(started){
        if(!silentSince) silentSince=Date.now();
        if(Date.now()-silentSince>450){ avListening=false; finishTurn(); return; }
      }
      // 安静 12 秒她主动说一句（整通电话最多 3 次）
      if(!paused && !callSpeaking && !playing && Date.now()-lastVoice > 12000 && idleFired < 3){
        idleFired++; lastVoice = Date.now();
        idleTalk();
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  async function finishTurn(){
    if(myId !== callLoopId) return;
    if(finishing) return;
    finishing = true;
    paused=true; waveBars(false);
    try{ callRec.stop(); }catch(e){}
    await new Promise(r=>setTimeout(r,100));
    const blob=new Blob(callChunks,{type:callRec.mimeType||'audio/webm'});
    if(blob.size<2500){ finishing=false; paused=false; listenLoop(); return; }
    cstat.textContent='…';
    const rd=new FileReader();
    rd.onload=async()=>{
      const t0=Date.now();
      try{
        // 1) 先转文字
        const r1=await apiFetch('/api/stt',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({audio:rd.result})});
        const d1=await r1.json();
        const heard=(d1.text||'').trim();
        if(!heard){ cstat.textContent='没听清'; finishing=false; paused=false; listenLoop(); return; }
        try{ await pushFrame(); }catch(e){}
        try{
          const er = await apiFetch('/api/emotion?text='+encodeURIComponent(heard));
          const ed = await er.json();
          if(ed && ed.emotion) callEmo = ed.emotion;
        }catch(e){}
        csaid.textContent='你说：'+heard;
        textBubble('me',heard);
        // 2) 流式生成，边出边合成边播
        if(activePlayer){ try{ activePlayer.stop(); }catch(e){} }
        const player=makePlayer(); activePlayer=player;
        let buf2='', spoken='', reply='';
        const resp=await apiFetch('/api/stream?call=1&text='+encodeURIComponent(heard));
        const reader=resp.body.getReader(); const dec=new TextDecoder(); let acc='';
        let firstCallChunk=true;
        const flush=(final)=>{
          // 把已经完整说完的句子切出来合成
          const parts=splitKeepPunct(spoken, SENT_PUNCT);
          let keep='';
          if(!final){ keep=parts.pop()||''; } else { keep=''; }
          const ready=parts.join('');
          if(ready.trim()){ player.push({u:ttsUrl(ready.trim(), firstCallChunk, callEmo), t:ready}); firstCallChunk=false; }
          spoken=keep;
          if(final && keep.trim()){ player.push({u:ttsUrl(keep.trim(), false, callEmo), t:keep}); spoken=''; }
        };
        while(true){
          const {done,value}=await reader.read(); if(done) break;
          acc+=dec.decode(value,{stream:true});
          let i;
          while((i=acc.indexOf('\n\n'))>=0){
            const chunk=acc.slice(0,i); acc=acc.slice(i+2);
            if(!chunk.startsWith('data:'))continue;
            let ev; try{ ev=JSON.parse(chunk.slice(5).trim()); }catch(e){ continue; }
            if(ev.type==='ping') continue;
            if(ev.type==='delta'){ buf2+=ev.t; spoken+=ev.t;
              csaid.textContent=(reply=clean(buf2))||'…';
              // 攒到句子就立刻合成
              // 第一句：只要有 3 个字就立刻合成，抢首字出声
              const _punct = /[。！？!?…~～，,、]/;
              if(firstCallChunk && (spoken.length >= 6 || (_punct.test(ev.t) && spoken.length >= 3))){
                const cut = _punct.test(spoken) ? spoken.search(_punct) + 1 : spoken.length;
                const head = spoken.slice(0, cut);
                spoken = spoken.slice(cut);
                player.push({u: ttsUrl(head, true, callEmo), t: head});
                firstCallChunk = false;
              } else if(/[。！？!?…~～\n]/.test(ev.t) ||
                 (spoken.length>=5 && /[，,、；;：:]/.test(ev.t)) ||
                 spoken.length>=22){ flush(false); }
            } else if(ev.type==='done'){ reply=ev.reply||reply; flush(true);
              try{ if(ev.emotion) setAvExpr(ev.emotion); }catch(e){}
              csaid.textContent=reply; voiceBubble(reply,null); }
          }
        }
        flush(true);
        cstat.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
      }catch(e){ cstat.textContent='断了一下'; }
      finishing=false; paused=false;
      if(inCall) setTimeout(listenLoop,120);
    };
    rd.readAsDataURL(blob);
  }
}

// ---------- 来电 ----------
const ring=document.getElementById('ring'), ringLine=document.getElementById('ringLine'),
      ringName=document.getElementById('ringName');
let ringAudio=null, ringTimer=null, ringOsc=null;

async function ringCall(item){
  ringLine.textContent = item.text || '……';
  ringName.textContent = BRAND.name || '来电';
  ring.classList.add('on');
  // 提示音（WebAudio 循环）
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const beep = () => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 660; o.type='sine';
      g.gain.value = 0.06;
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.25);
      ringOsc = {ac, o};
    };
    beep();
    ringTimer = setInterval(beep, 1200);
  }catch(e){}
  ringAudio = item.audio || null;
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('她在打电话给你', {body:item.text||'', icon:AV_HER}); }catch(e){}
  }
  window._incomingCall = item;
}
function stopRing(){
  ring.classList.remove('on');
  clearInterval(ringTimer); ringTimer=null;
  try{ ringOsc && ringOsc.ac && ringOsc.ac.close(); }catch(e){}
  ringOsc=null;
}
async function clearPending(){
  try{ await apiFetch('/api/pending?ack=1'); }catch(e){}
}
document.getElementById('rejectCall').onclick=async ()=>{
  const it = window._incomingCall;
  stopRing();
  await clearPending();
  if(it){ textBubble('her', '（未接来电）' + (it.text||'')); }
  window._incomingCall=null;
};
document.getElementById('acceptCall').onclick=async ()=>{
  const it = window._incomingCall; stopRing();
  await clearPending();
  await startCall();                      // 进入通话
  if(it && it.audio){
    try{ await new Promise(res=>{ const a=new Audio(it.audio); a.onended=res; a.onerror=res; a.play().catch(res); }); }catch(e){}
  }
  if(it){ csaid.textContent = it.text || ''; textBubble('her', it.text||''); }
  window._incomingCall=null;
};

// 轮询主动消息，来电就弹来电界面
const seenTs = {};
async function pollIncoming(){
  try{
    const r = await apiFetch('/api/pending?peek=1');
    if(!r.ok) return;
    const d = await r.json();
    for(const it of (d.items||[])){
      const key = (it.kind||'text') + ':' + (it.ts||0);
      if(seenTs[key]) continue;
      seenTs[key] = true;
      if(it.kind === 'call'){
        if(inCall){ if(it.text) textBubble('her', '（刚才还想打给你）' + it.text); continue; }
        ringCall(it);
      }
      else if(it.text){
        textBubble('her', it.text);
        if('Notification' in window && Notification.permission==='granted'){
          try{ new Notification(BRAND.name||'消息', {body:it.text, icon:AV_HER}); }catch(e){}
        }
      }
    }
  }catch(e){}
}

window.autoAnswerFromNative = async function(){
  try{
    const r = await apiFetch('/api/pending?ack=1');
    const d = await r.json();
    const items = d.items || [];
    const call = items.find(function(x){ return x.kind === 'call'; });
    await startCall();
    if(call){
      csaid.textContent = call.text || '';
      textBubble('her', call.text || '');
      if(call.audio){
        try{ await new Promise(function(res){
          var a=new Audio(call.audio); a.onended=res; a.onerror=res; a.play().catch(function(){res();});
        });}catch(e){}
      }
    }
    items.filter(function(x){ return x.kind !== 'call'; }).forEach(function(it){
      if(it.text){ textBubble('her', it.text); }
    });
  }catch(e){}
};

setInterval(pollIncoming, 8000);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ pollIncoming(); }
});
