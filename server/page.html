<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>大肥鱼</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1020;color:#e8eefc;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#bgwrap{position:fixed;inset:0;z-index:0;background:#0b1020;overflow:hidden}
#bgwrap::before{content:'';position:absolute;inset:-40px;background:url('/static/wallpaper.jpg?v=3') center/cover no-repeat;
  filter:blur(26px) brightness(.42) saturate(.9)}
#bgwrap::after{content:'';position:absolute;inset:0;background:url('/static/wallpaper.jpg?v=3') center top/contain no-repeat}
#veil{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(6,10,22,.35),rgba(6,10,22,.6))}
#app{display:flex;flex-direction:column;height:100dvh;position:relative;z-index:1}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;font-size:15px;
  background:rgba(17,26,51,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(29,42,74,.7);
  display:flex;align-items:center;gap:8px}
header .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84}
header .sp{flex:1}
header button{font-size:13px;color:#9fb4e0;padding:4px 8px}
#log{flex:1;overflow-y:auto;padding:14px 10px 6px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.row.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 38px;object-fit:cover;
  background:#1b2745;border:1px solid rgba(120,150,220,.35)}
.bub{max-width:74%;padding:10px 13px;border-radius:16px;line-height:1.55;font-size:15.5px;
  white-space:pre-wrap;word-break:break-word;position:relative}
.bub.her{background:rgba(27,39,69,.86);backdrop-filter:blur(6px);border-bottom-left-radius:5px}
.bub.me{background:rgba(47,107,255,.92);backdrop-filter:blur(6px);color:#fff;border-bottom-right-radius:5px}
.bub img{max-width:100%;border-radius:10px;display:block}
/* 语音条 */
.voice{display:flex;align-items:center;gap:8px;min-width:96px;cursor:pointer;user-select:none}
.voice .tri{width:0;height:0;border-left:9px solid #cfe0ff;border-top:6px solid transparent;
  border-bottom:6px solid transparent;transition:.15s}
.voice.playing .tri{border-left-color:#6f9bff;transform:scale(1.15)}
.voice .wave{display:flex;align-items:center;gap:2px;height:16px}
.voice .wave i{width:2px;background:#8fb0e8;border-radius:1px;display:block}
.voice .dur{font-size:12px;color:#9fb4e0;margin-left:2px}
.voice .txt{display:none;margin-top:6px;font-size:14px;line-height:1.5;color:#cfe0ff;
  border-top:1px dashed rgba(140,170,230,.3);padding-top:6px}
.voice.open + .txt,.bub.showtxt .txt{display:block}
.bub audio{display:none}
.time{font-size:11px;color:#5f6f92;margin:2px 46px 0;align-self:flex-start}
#bar{padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(17,26,51,.72);backdrop-filter:blur(10px);border-top:1px solid rgba(29,42,74,.7);
  display:flex;gap:8px;align-items:center}
#bar button{background:none;border:none;color:#9fb4e0;font-size:21px;padding:6px;border-radius:12px}
#bar button:active{background:#1b2745}
#box{flex:1;background:#0e1830;border:1px solid #223255;border-radius:20px;padding:10px 14px;
  color:#e8eefc;font-size:15.5px;resize:none;max-height:110px;outline:none;font-family:inherit}
#send{background:#2f6bff;color:#fff;border-radius:20px;padding:9px 16px;font-size:15px;border:none}
#send:disabled{opacity:.45}
.recording{color:#ff5d5d!important}
#tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000d;
  padding:14px 20px;border-radius:14px;font-size:14px;display:none;z-index:99;max-width:80%}
#panel{position:fixed;inset:0;background:#0b1020f2;z-index:50;display:none;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top) + 8px)}
#panel.on{display:flex}
#panel .ph{display:flex;align-items:center;padding:8px 14px;gap:10px}
#panel .ph b{flex:1;font-size:16px}
#panel .tabs{display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
#panel .tabs span{padding:6px 12px;border-radius:14px;background:#16203a;font-size:13px;color:#9fb4e0}
#panel .tabs span.on{background:#2f6bff;color:#fff}
#panel .body{flex:1;overflow-y:auto;padding:10px 14px 30px}
.card{background:#131d35;border:1px solid #1e2c4c;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card .t{font-size:11px;color:#5f6f92;margin-bottom:4px}
.card .c{font-size:14px;line-height:1.5;white-space:pre-wrap}
#panel input,#panel textarea{width:100%;background:#0e1830;border:1px solid #223255;border-radius:10px;
  padding:10px;color:#e8eefc;font-size:14px;margin-bottom:8px;font-family:inherit}
#panel .btn{background:#2f6bff;color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px}
#call{position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#0a1226,#060a16);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#call.on{display:flex}
#call .cav{width:130px;height:130px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(120,160,255,.5);box-shadow:0 0 40px rgba(60,110,255,.35)}
#call .cname{font-size:19px;letter-spacing:1px}
#call .cstat{font-size:13px;color:#8fa6d6}
#call .cwave{height:40px;display:flex;align-items:center;gap:3px}
#call .cwave i{width:3px;background:#5f8cff;border-radius:2px;opacity:.7;animation:cv .9s infinite ease-in-out}
@keyframes cv{0%,100%{height:6px}50%{height:26px}}
#call .csaid{font-size:14px;color:#b9c9ea;max-width:80%;text-align:center;min-height:20px;line-height:1.5}
#call .cbtns{margin-top:18px}
#call #hangup{background:#e0483f;color:#fff;border:none;border-radius:30px;padding:14px 46px;font-size:16px}
#gate{position:fixed;inset:0;background:#0b1020;z-index:200;display:none;
  align-items:center;justify-content:center;padding:24px}
#gate.on{display:flex}
#gate .gbox{width:100%;max-width:320px;text-align:center}
#gate .gt{font-size:17px;margin-bottom:14px}
#gate input{width:100%;background:#0e1830;border:1px solid #223255;border-radius:12px;
  padding:12px 14px;color:#e8eefc;font-size:16px;margin-bottom:12px;outline:none;text-align:center}
#gate button{width:100%;background:#2f6bff;color:#fff;border:none;border-radius:12px;
  padding:12px;font-size:16px}
#gate .gh{font-size:12px;color:#5f6f92;margin-top:12px}
#ring{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#0a1226,#05070f);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#ring.on{display:flex}
#ring .rav{width:140px;height:140px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(120,160,255,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,140,255,.5)}70%{box-shadow:0 0 0 26px rgba(90,140,255,0)}100%{box-shadow:0 0 0 0 rgba(90,140,255,0)}}
#ring .rt{font-size:13px;color:#8fa6d6;letter-spacing:2px}
#ring .rn{font-size:22px}
#ring .rs{font-size:14px;color:#b9c9ea;max-width:80%;text-align:center;line-height:1.5}
#ring .rbtns{display:flex;gap:26px;margin-top:26px}
#ring button{border:none;border-radius:40px;padding:16px 34px;font-size:16px;color:#fff}
#ring .rno{background:#e0483f}
#ring .ryes{background:#2fbf6a}
#setp{position:fixed;inset:0;background:#0b1020f5;z-index:90;display:none;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top) + 8px)}
#setp.on{display:flex}
#setp .ph{display:flex;align-items:center;padding:8px 14px;gap:10px}
#setp .ph b{flex:1;font-size:16px}
#setp .body{flex:1;overflow-y:auto;padding:10px 14px 30px}
#setp .btn{background:#2f6bff;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:14px}
</style></head>
<body>

  <header><span class="dot"></span>大肥鱼<span class="sp"></span>

</div>
<div id="gate">
  <div class="gbox">

    <input id="gateInput" type="password" placeholder="输入访问口令" autocomplete="current-password">
    <button id="gateBtn">进入</button>

</div>
<div id="ring">
  <img class="rav" src="/static/icon-512.png">
  <div class="rt">来电</div>

<input type="file" id="file" accept="image/*" style="display:none">
<script>
window.onerror = function(msg, src, line){
  try{
    var d=document.getElementById('fatal');
    if(!d){ d=document.createElement('div'); d.id='fatal';
      d.style.cssText='position:fixed;inset:0;z-index:999;background:#0b1020;color:#e8eefc;padding:24px;font-size:13px;white-space:pre-wrap;overflow:auto';
      document.body.appendChild(d); }
    d.textContent = '页面出错了（把这段发给我）：\n' + msg + '\n' + (src||'') + ':' + line;
  }catch(e){}
};

// ---------- 访问口令 ----------
const TOKEN_KEY='dafeiyu_token';
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
async function apiFetch(url,opt){
  opt=opt||{}; opt.headers=Object.assign({}, opt.headers||{});
  const tk=getToken(); if(tk) opt.headers['X-Token']=tk;
  let r=await fetch(url,opt);
  if(r.status===401){
    const t=prompt('请输入访问口令');
    if(t){ localStorage.setItem(TOKEN_KEY,t.trim());
      opt.headers['X-Token']=t.trim(); r=await fetch(url,opt); }
  }
  return r;
}

const AV_HER='/static/icon-192.png';
const log=document.getElementById('log'),box=document.getElementById('box'),
      sendBtn=document.getElementById('send'),mic=document.getElementById('mic'),
      file=document.getElementById('file'),tip=document.getElementById('tip');
function scroll(){log.scrollTop=log.scrollHeight;}
function showTip(t,ms){tip.textContent=t;tip.style.display='block';
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.style.display='none',ms||1600);}
function mkRow(who){
  const row=document.createElement('div');row.className='row '+(who==='me'?'me':'');
  const av=document.createElement('img');av.className='av';
  av.src=who==='me'?'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76"><rect width="76" height="76" rx="38" fill="#2f6bff"/><text x="38" y="48" font-size="30" text-anchor="middle" fill="#fff" font-family="sans-serif">我</text></svg>')
    :AV_HER;
  const b=document.createElement('div');b.className='bub '+(who==='me'?'me':'her');
  row.appendChild(av);row.appendChild(b);log.appendChild(row);scroll();
  return b;
}
function textBubble(who,text){const b=mkRow(who);b.textContent=text;return b;}
function imgBubble(who,src){const b=mkRow(who);const im=document.createElement('img');im.src=src;b.appendChild(im);return b;}
function waveHtml(n){let h='<div class="wave">';for(let i=0;i<(n||5);i++){
  const hh=4+Math.round(Math.random()*10);h+=`<i style="height:${hh}px"></i>`;}return h+'</div>';}
function voiceBubble(text,audio,durSec){
  const b=mkRow('her');
  const v=document.createElement('div');v.className='voice';
  v.innerHTML='<div class="tri"></div>'+waveHtml(6)+`<span class="dur">${durSec||Math.max(1,Math.round(text.length/4))}"</span>`;
  b.appendChild(v);
  const hidden=document.createElement('div');hidden.className='txt';hidden.textContent=text;b.appendChild(hidden);
  const a=document.createElement('audio');a.src=audio;a.preload='auto';b.appendChild(a);
  v.onclick=()=>{a.play().catch(()=>{});v.classList.add('playing');
    setTimeout(()=>v.classList.remove('playing'),Math.max(1500,(durSec||4)*1000));};
  let lp;const start=()=>{lp=setTimeout(()=>{b.classList.toggle('showtxt');},550);};
  const cancel=()=>clearTimeout(lp);
  v.addEventListener('touchstart',start,{passive:true});
  v.addEventListener('touchend',cancel);
  v.addEventListener('mousedown',start);
  v.addEventListener('mouseup',cancel);
  v.addEventListener('contextmenu',e=>{e.preventDefault();b.classList.toggle('showtxt');});
  return b;
}


// 兼容老 WebView：不用后行断言（(?<=) 在 Chrome<62 会整段语法错误）
function splitKeepPunct(text, puncts){
  const out=[]; let cur='';
  for(let i=0;i<text.length;i++){
    const ch=text[i]; cur+=ch;
    if(puncts.indexOf(ch)>=0){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out;
}
const SENT_PUNCT = '。！？!?…~～\n';

// ---------- 公共：文本清理 / 播放队列 ----------
function clean(t){
  return (t||'')
    .replace(/\[draw\][\s\S]*?(\[\/draw\]|$)/g,'')
    .replace(/\[meme\][\s\S]*?(\[\/meme\]|$)/g,'')
    .replace(/(用户未成年|露骨色情)[\s\S]*?(safety|规则|$)/gi,'')
    .replace(/【[^】]{0,6}】/g,'');
}
function makePlayer(){
  const q=[]; let running=false;
  async function pump(){
    if(running) return; running=true;
    while(q.length){
      const item=q.shift();
      let url=item;
      if(item && typeof item.then==='function'){ try{ url=await item; }catch(e){ url=null; } }
      if(!url) continue;
      playing = null;
      await new Promise(res=>{
        const a=new Audio(url); window._lastAudio=a;
        a.onended=res; a.onerror=res;
        const pr=a.play();
        if(pr&&pr.catch){ pr.catch(()=>{ res(); }); }
      });
    }
    running=false;
  }
  return { push(u){ q.push(u); pump(); }, clear(){ q.length=0; } };
}

async function sayText(text){
  if(!text.trim())return;
  textBubble('me',text);box.value='';box.style.height='auto';sendBtn.disabled=true;
  const b=mkRow('her');b.textContent='';
  let raw='', spoken='', player=null, audioDone=false;
  const ensurePlayer=()=>{ if(!player) player=makePlayer(); return player; };
  let firstChunk = true;
  const flushPart=(final)=>{
    let ready = '';
    if(final){
      ready = spoken; spoken = '';
    } else {
      let m = spoken.match(/^[\s\S]*?[。！？!?…~～\n]/);   // 到第一个句子边界
      if(!m && spoken.length >= 4) m = spoken.match(/^[\s\S]*?[，,、；;]/);  // 首句：有逗号也先切
      if(!m) return;
      // 后续块攒大一点（减少合成次数和空隙），但不超过 24 字
      if(!firstChunk && m[0].length < 10 && spoken.length < 24){
        const m2 = spoken.match(/^[\s\S]{0,24}?[。！？!?…~～\n]/);
        if(m2 && m2[0].length >= 10) m = m2;
      }
      ready = m[0];
      spoken = spoken.slice(ready.length);
    }
    const txt = ready.trim();
    if(txt.length >= 2){
      ensurePlayer().push(ttsUrl(txt, firstChunk));   // 第一句走快速路径
      firstChunk = false;
    }
  };
  try{
    const resp=await apiFetch('/api/stream?text='+encodeURIComponent(text));
    const rd=resp.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        if(!chunk.startsWith('data:'))continue;
        const ev=JSON.parse(chunk.slice(5).trim());
        if(ev.type==='delta'){
          raw+=ev.t; spoken+=ev.t;
          b.textContent=clean(raw);scroll();
          // 一出句号/逗号就先合成，抢时间
          if(/[。！？!?…~～\n]/.test(ev.t) || (spoken.length>=6 && /[，,、；;：:]/.test(ev.t))) flushPart(false);
        } else if(ev.type==='done'){
          b.remove();
          if(ev.audio){ voiceBubble(ev.reply, ev.audio); }
          else if(ev.reply){
            const parts = splitKeepPunct(spoken, SENT_PUNCT);
            const rest = (parts.pop()||'').trim();
            const ready = parts.join('').trim();
            spoken = '';
            if(ready) ensurePlayer().push(ttsUrl(ready, true));
            if(rest) ensurePlayer().push(ttsUrl(rest, false));
          }
          (ev.images||[]).forEach(im=>imgBubble('her',im));
          scroll();
        } else if(ev.type==='error'){ b.textContent='连不上她……'; }
      }
    }
  }catch(e){ b.textContent='连不上她……'; }
  sendBtn.disabled=false;scroll();
}

// 按句渐进播放（聊天用）：第一句先合成先播，边播边合成下一句
function splitSentences(t){
  const raw = splitKeepPunct(t||'', SENT_PUNCT).map(x=>x.trim()).filter(Boolean);
  const out=[]; let cur='';
  for(const p of raw){
    if(cur && (cur.length+p.length) > 20){ out.push(cur); cur=p; }
    else cur += p;
  }
  if(cur) out.push(cur);
  return out.length ? out : (t? [t] : []);
}
async function ttsUrl(text, fast){
  try{
    const r = await apiFetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(fast?{text,fast:true}:{text})});
    const d = await r.json(); return d.audio||null;
  }catch(e){ return null; }
}
async function speakProgressive(text){
  const parts = splitSentences(text);
  if(!parts.length) return;
  let next = ttsUrl(parts[0], true);      // 第一句用快速路径
  for(let i=0;i<parts.length;i++){
    const cur = next;
    next = (i+1<parts.length) ? ttsUrl(parts[i+1], false) : Promise.resolve(null);
    const url = await cur;
    if(!url){ textBubble('her', parts[i]); continue; }
    const b = voiceBubble(parts[i], url);
    const a = b.querySelector('audio');
    if(a){
      try{
        await new Promise(res=>{ a.onended=res; a.onerror=res; a.play().catch(res); });
      }catch(e){}
    }
  }
}


// ---------------- 打电话 ----------------
let inCall=false, callStream=null, audioCtx=null, analyser=null,
    callRec=null, callChunks=[], paused=false, playing=null;
const callEl=document.getElementById('call'),
      cstat=document.getElementById('cstat'),
      csaid=document.getElementById('csaid'),
      cwave=document.getElementById('cwave');

function waveBars(on){
  if(!cwave) return;
  cwave.innerHTML = on ? Array.from({length:14},function(){
    return '<i style="animation-delay:'+(Math.random()).toFixed(2)+'s"></i>';
  }).join('') : '';
}
function rmsOf(buf){
  let sum=0;
  for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
  return Math.sqrt(sum/buf.length);
}
async function startCall(){
  inCall=true; paused=false;
  callEl.classList.add('on'); csaid.textContent='';
  cstat.textContent='连接中…';
  try{
    callStream=await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(callStream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=1024;
    src.connect(analyser);
    cstat.textContent='说吧，我听着';
    listenLoop();
  }catch(e){ cstat.textContent='拿不到麦克风'; }
}
function stopCall(){
  inCall=false; callEl.classList.remove('on');
  try{ apiFetch('/api/pending?ack=1'); }catch(e){}
  try{ if(playing){ playing.pause(); playing=null; } }catch(e){}
  try{ if(callRec && callRec.state==='recording') callRec.stop(); }catch(e){}
  try{ if(callStream) callStream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  try{ if(audioCtx) audioCtx.close(); }catch(e){}
  waveBars(false); csaid.textContent='';
}
document.getElementById('callBtn').onclick=function(){ startCall(); };
document.getElementById('hangup').onclick=function(){ stopCall(); };

async function idleTalk(){
  try{
    cstat.textContent='她想了想…';
    const r = await apiFetch('/api/idle_talk',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const d = await r.json();
    if(!d.ok || !d.reply) { cstat.textContent='说吧，我听着'; return; }
    csaid.textContent = d.reply;
    textBubble('her', d.reply);
    if(d.audio){
      await new Promise(function(res){
        var a=new Audio(d.audio);
        a.onended=res; a.onerror=res;
        a.play().catch(function(){ res(); });
      });
    }
    cstat.textContent='说吧，我听着';
  }catch(e){}
}

async function listenLoop(){
  if(!inCall) return;
  cstat.textContent='说吧，我听着';
  const buf=new Uint8Array(analyser.frequencyBinCount);
  callRec=new MediaRecorder(callStream); callChunks=[];
  callRec.ondataavailable=e=>{ if(e.data.size>0) callChunks.push(e.data); };
  callRec.start();
  let started=false, silentSince=0, bargeStart=0;

  let lastVoice = Date.now(), idleFired = 0;
  const tick=()=>{
    if(!inCall) return;
    analyser.getByteTimeDomainData(buf);
    const r=rmsOf(buf);
    if(playing && r>0.05){
      if(!bargeStart) bargeStart=Date.now();
      if(Date.now()-bargeStart>300){
        try{ playing.pause(); }catch(e){}
        playing=null; bargeStart=0; cstat.textContent='…你说';
      }
    } else if(r<=0.05){ bargeStart=0; }
    if(!paused){
      if(r>0.022){ started=true; silentSince=0; lastVoice=Date.now(); idleFired=0; waveBars(true);
        if(cstat.textContent==='说吧，我听着') cstat.textContent='…'; }
      else if(started){
        if(!silentSince) silentSince=Date.now();
        if(Date.now()-silentSince>450){ finishTurn(); return; }
      }
      // 安静 12 秒她主动说一句（整通电话最多 3 次）
      if(!paused && !playing && Date.now()-lastVoice > 12000 && idleFired < 3){
        idleFired++; lastVoice = Date.now();
        idleTalk();
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  async function finishTurn(){
    paused=true; waveBars(false);
    try{ callRec.stop(); }catch(e){}
    await new Promise(r=>setTimeout(r,100));
    const blob=new Blob(callChunks,{type:callRec.mimeType||'audio/webm'});
    if(blob.size<2500){ paused=false; listenLoop(); return; }
    cstat.textContent='…';
    const rd=new FileReader();
    rd.onload=async()=>{
      const t0=Date.now();
      try{
        // 1) 先转文字
        const r1=await apiFetch('/api/stt',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({audio:rd.result})});
        const d1=await r1.json();
        const heard=(d1.text||'').trim();
        if(!heard){ cstat.textContent='没听清'; paused=false; listenLoop(); return; }
        csaid.textContent='你说：'+heard;
        textBubble('me',heard);
        // 2) 流式生成，边出边合成边播
        const player=makePlayer();
        let buf2='', spoken='', reply='';
        const resp=await apiFetch('/api/stream?call=1&text='+encodeURIComponent(heard));
        const reader=resp.body.getReader(); const dec=new TextDecoder(); let acc='';
        let firstCallChunk=true;
        const flush=(final)=>{
          // 把已经完整说完的句子切出来合成
          const parts=splitKeepPunct(spoken, SENT_PUNCT);
          let keep='';
          if(!final){ keep=parts.pop()||''; } else { keep=''; }
          const ready=parts.join('');
          if(ready.trim()){ player.push(ttsUrl(ready.trim(), firstCallChunk)); firstCallChunk=false; }
          spoken=keep;
          if(final && keep.trim()){ player.push(ttsUrl(keep.trim(), false)); spoken=''; }
        };
        while(true){
          const {done,value}=await reader.read(); if(done) break;
          acc+=dec.decode(value,{stream:true});
          let i;
          while((i=acc.indexOf('\n\n'))>=0){
            const chunk=acc.slice(0,i); acc=acc.slice(i+2);
            if(!chunk.startsWith('data:'))continue;
            const ev=JSON.parse(chunk.slice(5).trim());
            if(ev.type==='delta'){ buf2+=ev.t; spoken+=ev.t;
              csaid.textContent=(reply=clean(buf2))||'…';
              // 攒到句子就立刻合成
              if(/[。！？!?…~～\n]/.test(ev.t) ||
                 (spoken.length>=3 && /[，,、；;：:]/.test(ev.t)) ||
                 spoken.length>=14){ flush(false); }
            } else if(ev.type==='done'){ reply=ev.reply||reply; flush(true);
              csaid.textContent=reply; voiceBubble(reply,null); }
          }
        }
        flush(true);
        cstat.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
      }catch(e){ cstat.textContent='断了一下'; }
      paused=false;
      if(inCall) setTimeout(listenLoop,120);
    };
    rd.readAsDataURL(blob);
  }
}

const ring=document.getElementById('ring'), ringLine=document.getElementById('ringLine'),
      ringName=document.getElementById('ringName');
let ringAudio=null, ringTimer=null, ringOsc=null;

async function ringCall(item){
  ringLine.textContent = item.text || '……';
  ringName.textContent = BRAND.name || '来电';
  ring.classList.add('on');
  // 提示音（WebAudio 循环）
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const beep = () => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 660; o.type='sine';
      g.gain.value = 0.06;
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.25);
      ringOsc = {ac, o};
    };
    beep();
    ringTimer = setInterval(beep, 1200);
  }catch(e){}
  ringAudio = item.audio || null;
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('她在打电话给你', {body:item.text||'', icon:AV_HER}); }catch(e){}
  }
  window._incomingCall = item;
}
function stopRing(){
  ring.classList.remove('on');
  clearInterval(ringTimer); ringTimer=null;
  try{ ringOsc && ringOsc.ac && ringOsc.ac.close(); }catch(e){}
  ringOsc=null;
}

// 轮询主动消息，来电就弹来电界面
const seenTs = {};
async function pollIncoming(){
  try{
    const r = await apiFetch('/api/pending?peek=1');
    if(!r.ok) return;
    const d = await r.json();
    for(const it of (d.items||[])){
      const key = (it.kind||'text') + ':' + (it.ts||0);
      if(seenTs[key]) continue;
      seenTs[key] = true;
      if(it.kind === 'call'){
        if(inCall){ if(it.text) textBubble('her', '（刚才还想打给你）' + it.text); continue; }
        ringCall(it);
      }
      else if(it.text){
        textBubble('her', it.text);
        if('Notification' in window && Notification.permission==='granted'){
          try{ new Notification(BRAND.name||'消息', {body:it.text, icon:AV_HER}); }catch(e){}
        }
      }
    }
  }catch(e){}
}

window.autoAnswerFromNative = async function(){
  try{
    const r = await apiFetch('/api/pending?ack=1');
    const d = await r.json();
    const items = d.items || [];
    const call = items.find(function(x){ return x.kind === 'call'; });
    await startCall();
    if(call){
      csaid.textContent = call.text || '';
      textBubble('her', call.text || '');
      if(call.audio){
        try{ await new Promise(function(res){
          var a=new Audio(call.audio); a.onended=res; a.onerror=res; a.play().catch(function(){res();});
        });}catch(e){}
      }
    }
    items.filter(function(x){ return x.kind !== 'call'; }).forEach(function(it){
      if(it.text){ textBubble('her', it.text); }
    });
  }catch(e){}
};

      body:JSON.stringify({kind, image:dataUrl})});

    if(d.ok){ await loadBrand(); showTip('已更新'); } else showTip('上传失败');
  }catch(e){ showTip('上传失败'); }
}
